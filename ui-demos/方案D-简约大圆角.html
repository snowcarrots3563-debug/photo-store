function visibleIds(){if(ui.page==='artist')return images(allArtist(ui.artist));if(ui.page==='unfiled')return images(unfiled());const ids=[...collection(ui.collection).ids],sort=ui.sorts[ui.collection]||'manual';return sort==='manual'?ids:sort==='asc'?natural(ids):natural(ids).reverse()}
function render(){const focusedAction=document.activeElement?.dataset?.action;let html='';const main=$('#main');main.className='';if(ui.page==='home'){html=`<div class="top"><h1>画师</h1>${ib('plus','添加','addMenu')}</div><div class="search">${icon('search')}<input id="artistSearch" aria-label="搜索画师" placeholder="搜索画师" value="${esc(ui.search)}">${ib('close','清除搜索','clearSearch')}</div><p class="sectionlabel">我的画师</p><div id="artistResults"></div><p class="hint">把喜欢的画作，放回熟悉的名字里。</p>`}

else if(ui.page==='collection'){const c=collection(ui.collection);html=header(c.name,'collectionMenu')+`<p class="hint" style="margin-left:0">${esc(artist(c.artist).name)} · ${countText(c.ids)}</p><div class="toolbar"><button data-action="comic" ${images(c.ids).length?'':'disabled'}>${icon('comic')}漫画</button><button data-action="sort">${icon('sort')}排序</button><button data-action="select" ${c.ids.length?'':'disabled'}>${icon('select')}${ui.selection?'退出多选':'多选'}</button></div>`+(c.ids.length?grid(visibleIds()):empty('给这次收藏留个位置','导入图片后，会完整显示在这里。','<button class="soft" data-action="import">导入示例</button>'))}
else if(ui.page==='manage'){html=`<div class="top"><h1>管理</h1></div><div class="infobox"><h3>只在这次演示中整理</h3><p>浏览与整理可以实际体验。文件导入、解压、导出和备份均为流程演示，刷新后恢复示例。</p></div><section class="section"><p class="sectionlabel">图库</p><div class="group">${row('未归组图片',`${images(unfiled()).length} 张图片，可重新加入作品集`,'unfiled','image')}${row('导入','相册、ZIP、RAR、7z','import','import')}${row('按范围导出','图片、作品集或画师','exportChoose','export')}${row('完整备份','原图、作品集与整理关系','backup','archive')}</div></section><section class="section"><p class="sectionlabel">浏览</p><div class="group"><div class="row"><span class="rowtext"><strong>卡牌效果</strong><small>拖动时呈现镭射与立体感</small></span><button class="switch" role="switch" aria-label="卡牌效果" aria-checked="${state.effect}" data-action="effect"></button></div><div class="row"><span class="rowtext"><strong>播放 GIF 动画</strong><small>关闭后显示静态示意，原 GIF 保留</small></span><button class="switch" role="switch" aria-label="播放 GIF 动画" aria-checked="${!state.gifPaused}" data-action="gif"></button></div></div></section><section class="section"><p class="sectionlabel">演示</p><div class="group">${row('演示说明','查看素材与模拟边界','about','info')}${row('重置示例状态','恢复初始画师和作品集','reset','reset')}</div></section>`}
else if(ui.page==='unfiled'){const ids=images(unfiled());html=header('未归组图片')+`<p class="hint" style="margin-left:0">${ids.length} 张图片 · 保留的原图仍可重新整理</p><div class="sectionhead"><p>暂时没有作品集引用</p>${ids.length?'<button class="textbtn" data-action="select">多选</button>':''}</div>`+(ids.length?grid(ids):empty('这里很整齐','移除最后引用时选择保留的图片，会出现在这里。'))}
else if(ui.page==='card'){main.className='cardpage';const id=ui.cardIds[ui.cardIndex],m=state.media[id];html=`<div class="backrow">${ib('back','返回图库','back')}<button class="textbtn" data-action="original">查看原图</button>${ib('more','图片操作','cardMenu')}</div><div class="cardstage"><div id="artcard" class="artcard" aria-label="拖动画作体验卡牌效果" tabindex="0">${imageHTML(id)}<div class="laser"></div><div class="shine"></div></div></div><p class="cardname">${esc(m.name)}</p><div class="cardcontrols">${ib('back','上一张','prev')}<span class="muted">${ui.cardIndex+1} / ${ui.cardIds.length}</span>${ib('next','下一张','next')}</div><p class="hint" style="text-align:center">${state.effect?'按住画作拖动，松手回正':'卡牌效果已关闭，可在管理中开启'}</p>`}
else if(ui.page==='comic'){main.className='reading';const c=collection(ui.collection),ids=comicIds();html=`<header class="readhead">${ib('back','退出漫画','back')}<h1>${esc(c.name)}</h1>${ib('sort','漫画名称排序','sort')}</header><div class="comic">${ids.map(id=>`<figure data-media="${id}">${imageHTML(id)}<figcaption>${esc(state.media[id].name)}</figcaption></figure>`).join('')}</div><p class="hint" style="text-align:center">已读到这里 · ${ids.length} 张图片${c.ids.some(id=>state.media[id].type==='video')?' · MP4 保留在作品集中':''}</p>`}
main.innerHTML=html;if(ui.page==='home')renderArtists();renderNavigation();if(ui.page==='card')bindCard();if(focusedAction&&!$('#dialog')){const focus=[...document.querySelectorAll('[data-action]')].find(el=>el.dataset.action===focusedAction&&!el.disabled);if(focus)focus.focus({preventScroll:true});else main.focus({preventScroll:true})}}
function countText(ids){return `${images(ids).length} 张图片${ids.filter(id=>state.media[id]?.type==='video').length?` · ${ids.filter(id=>state.media[id]?.type==='video').length} 个视频`:''}`}
function renderArtists(){const list=state.artists.filter(a=>a.name.includes(ui.search.trim()));$('#artistResults').innerHTML=list.length?`<div class="group">${list.map(a=>{const ids=images(allArtist(a.id));return `<button class="row" data-action="artist:${a.id}">${ids.length?imageHTML(ids[0],'avatar'):`<span class="avatar emptyavatar">${icon('artists')}</span>`}<span class="rowtext"><strong>${esc(a.name)}</strong><small>${groups(a.id).length} 个作品集 · ${ids.length} 张图片</small></span>${icon('next')}</button>`}).join('')}</div>`:empty('没有找到画师','试试更短的名字，或清除搜索。','<button class="soft" data-action="clearSearch">清除搜索</button>')}
function renderNavigation(){let html='';if(ui.selection){html=`<div class="selectionbar"><div class="selectiontop"><span>已选 ${ui.selected.size} 张图片</span><button class="textbtn" data-action="selectAll">全选</button><button class="textbtn" data-action="select">完成</button></div><div class="selectionactions"><button class="soft" data-action="reuse" ${ui.selected.size?'':'disabled'}>加入作品集</button>${ui.page==='collection'?`<button class="danger" data-action="remove" ${ui.selected.size?'':'disabled'}>移除</button>`:''}<button class="soft" data-action="exportImages" ${ui.selected.size?'':'disabled'}>导出</button></div></div>`}else if(!['card','comic'].includes(ui.page)){html=`<nav class="bottomnav" aria-label="主导航"><button class="${ui.page!=='manage'?'active':''}" data-action="home">${icon('artists')}画师</button><button class="${ui.page==='manage'?'active':''}" data-action="manage">${icon('manage')}管理</button></nav>`}$('#navigation').innerHTML=html}
function comicIds(){const ids=natural(images(collection(ui.collection).ids));return ui.comicSort[ui.collection]==='desc'?ids.reverse():ids}
function openModal(title,content,options={}){const already=!!$('#dialog');if(!already)modalReturn=document.activeElement;$('#layers').innerHTML=`<div class="overlay ${options.sort?'sortoverlay':''}"><section id="dialog" class="dialog ${options.sort?'sortdialog':''}" role="dialog" aria-modal="true" aria-labelledby="dialogTitle" tabindex="-1">${options.sort?`<h2 id="dialogTitle">${title}</h2>`:`<div class="dialoghead">${options.back?ib('back','上一步',options.back):''}<h2 id="dialogTitle">${title}</h2>${ib('close','取消','close')}</div>`}${content}</section></div>`;$('#app').inert=true;document.body.style.overflow='hidden';const focus=$('#dialog input:not([type=checkbox]):not([type=radio]),#dialog select,#dialog button');(focus||$('#dialog')).focus()}

$('#artistForm').onsubmit=e=>{
e.preventDefault();
const name=$('#artistName').value.trim();

function temporaryCollectionName(a){while(groups(a).some(c=>c.name==='未命名作品集 '+state.next))state.next++;return '未命名作品集 '+state.next}function newCollection(rename=false){const c=rename?collection(ui.collection):null;openModal(rename?'作品集改名':'新建作品集',`<p class="hint">${rename?'更改名称不会影响图片和共享关系。':'可以先留空，使用临时名称，之后再改。'}</p><form id="nameForm"><label class="field">作品集名称<input id="collectionName" maxlength="100" value="${c?esc(c.name):''}" placeholder="暂时还没想好"></label><div id="nameError" class="error" role="alert"></div><div class="actions"><button type="button" data-action="close">取消</button><button class="primary" type="submit">${rename?'保存名称':'创建作品集'}</button></div></form>`);$('#nameForm').onsubmit=e=>{e.preventDefault();const a=c?c.artist:ui.artist,value=$('#collectionName').value.trim()||temporaryCollectionName(a);if(groups(a).some(x=>x.name===value&&x.id!==c?.id)){$('#nameError').textContent='该画师已有同名作品集，请换一个名称。';return}if(c)c.name=value;else{const nc={id:'c'+state.next++,artist:a,name:value,ids:[]};state.collections.push(nc);ui.collection=nc.id;ui.page='collection'}closeModal();render();toast(c?'作品集名称已更新':'已创建作品集，可随时改名')}}
function openReuse(ids=[...ui.selected]){const a=ui.artist;openModal('加入作品集',`<p class="hint">选中 ${ids.length} 项。共享同一份原图，原作品集中的图片保留。</p><label class="field">目标画师<select id="reuseArtist">${state.artists.map(x=>`<option value="${x.id}" ${x.id===a?'selected':''}>${esc(x.name)}</option>`).join('')}</select></label><label class="field">目标作品集<select id="reuseCollection"></select></label><p id="reuseHint" class="hint"></p><div class="actions"><button data-action="close">取消</button><button class="primary" id="reuseConfirm">加入作品集</button></div>`);const fill=()=>{const cs=groups($('#reuseArtist').value);$('#reuseCollection').innerHTML=cs.map(c=>`<option value="${c.id}">${esc(c.name)}</option>`).join('');$('#reuseConfirm').disabled=!cs.length;$('#reuseHint').textContent=cs.length?'目标已有的图片会自动跳过。':'该画师还没有作品集，请先在画师页创建。'};fill();$('#reuseArtist').onchange=fill;$('#reuseConfirm').onclick=()=>{const c=collection($('#reuseCollection').value);let added=0;ids.forEach(id=>{if(!c.ids.includes(id)){c.ids.push(id);added++}});closeModal();render();toast(`已加入 ${added} 项，跳过已有 ${ids.length-added} 项；原图未复制。`)}}
function removeSelected(){const ids=[...ui.selected],c=collection(ui.collection),last=ids.filter(id=>refs(id).length===1),shared=ids.length-last.length;const execute=del=>{c.ids=c.ids.filter(id=>!ids.includes(id));if(del)last.forEach(id=>delete state.media[id]);ui.selected.clear();closeModal();render();toast(`移除 ${ids.length} 个引用；${shared} 项共享原图保留${last.length?`，${last.length} 项${del?'原图已删除':'原图已保留'}`:''}。`)};if(!last.length){execute(false);return}openModal('是否删除图片？',`<p class="hint">本次移除 ${ids.length} 项。其中 ${last.length} 项是最后一个引用，${shared} 项仍被其他作品集引用。</p><div class="notice">选择保留后，无引用的图片可在“管理 → 未归组图片”重新整理。仍有共享引用的原图始终保留。</div><div class="group">${last.map(id=>`<div class="resultrow">${esc(state.media[id].name)}</div>`).join('')}</div><div class="actions"><button data-action="close">取消</button><button class="soft" id="keepOriginal">保留图片</button><button class="danger" id="deleteOriginal">删除图片</button></div>`);$('#keepOriginal').onclick=()=>execute(false);$('#deleteOriginal').onclick=()=>execute(true)}
function openSort(){const comic=ui.page==='comic',value=comic?(ui.comicSort[ui.collection]||'asc'):(ui.sorts[ui.collection]||'manual');const opts=comic?[['asc','名称正序'],['desc','名称倒序']]:[['manual','手动顺序'],['asc','名称正序'],['desc','名称倒序']];openModal(comic?'漫画阅读顺序':'图片排序',opts.map(([v,label])=>`<button class="${value===v?'chosen':''}" data-action="sortValue:${v}" aria-pressed="${value===v}">${label}${value===v?icon('check'):''}</button>`).join(''),{sort:true})}
function bindCard(){const card=$('#artcard');let active=false;card.onpointerdown=e=>{if(!state.effect)return;active=true;card.setPointerCapture(e.pointerId);card.classList.add('dragging');update(e)};function update(e){if(!active)return;const r=card.getBoundingClientRect(),x=Math.max(-1,Math.min(1,(e.clientX-r.left)/r.width*2-1)),y=Math.max(-1,Math.min(1,(e.clientY-r.top)/r.height*2-1));card.style.transform=`rotateX(${-y*13}deg) rotateY(${x*17}deg)`;card.style.setProperty('--gx',`${(x+1)*50}%`);card.style.setProperty('--gy',`${(y+1)*50}%`);card.style.boxShadow=`${-x*5}px ${4+y*3}px 0 #A7B8CD,${-x*18}px ${20+y*8}px 32px #263e6026`;}card.onpointermove=update;const stop=()=>{active=false;card.classList.remove('dragging');card.style.transform='rotateX(0deg) rotateY(0deg)';card.style.boxShadow='';card.style.setProperty('--gx','50%');card.style.setProperty('--gy','50%')};card.onpointerup=stop;card.onpointercancel=stop;card.onlostpointercapture=stop}

if(d.step===1&&d.source!=='album'){title=d.source+' 导入场景';body=`<p class="hint">选择要体验的场景，均不执行真实解压。</p><div class="group">${[['normal','普通压缩包','直接预览目录'],['password','密码包','可体验密码错误与重试'],['parts','分卷包','可体验缺卷与补齐'],['both','密码分卷包','依次检查密码和分卷']].map(([k,t,s])=>`<button class="row" data-action="scenario:${k}"><span class="rowtext"><strong>${t}</strong><small>${s}</small></span>${d.scenario===k?icon('check'):icon('next')}</button>`).join('')}</div><div class="actions"><button data-action="close">取消</button><button class="primary" data-action="importNext">继续</button></div>`}
if(d.step===2){if(['password','both'].includes(d.scenario)&&!d.passwordOK){title='输入压缩包密码';body=`<p class="hint">${d.source} 密码包流程演示。示例密码：1234。</p><form id="passwordForm"><label class="field">密码<input id="archivePassword" type="password" autocomplete="off" placeholder="请输入示例密码"></label><p id="passwordError" role="alert" class="error"></p><div class="actions"><button type="button" data-action="close">取消</button><button class="primary">解锁预览</button></div></form>`}else if(['parts','both'].includes(d.scenario)&&!d.completeParts){title='补齐缺少的分卷';body=`<p class="hint">散步合集 · ${d.source} 分卷演示</p><div class="group"><div class="resultrow">part1 · 已选择</div><div class="resultrow danger">part2 · 缺少此卷</div><div class="resultrow">part3 · 已选择</div></div><div class="notice">同一包的分卷作为一次导入；补齐后才能继续，不会分开创建作品集。</div><div class="actions"><button data-action="close">取消</button><button class="primary" data-action="completeParts">补齐 part2 样例</button></div>`}else{d.step=3;showImport();return}}
if(d.step===3){title='选择导入位置';body=`<p class="hint">${d.source==='album'?'把选中的图片加入一个作品集。':'子文件夹将按原名创建作品集；这里选择归属画师。'}</p><label class="field">目标画师<select id="importArtist">${state.artists.map(a=>`<option value="${a.id}" ${d.artist===a.id?'selected':''}>${esc(a.name)}</option>`).join('')}</select></label>${d.source==='album'?`<label class="field">目标作品集<select id="importCollection"></select></label>`:`<div class="notice">湖畔散步、过程记录将分别归入所选画师。文字说明与全部失败目录不会建立空作品集。</div>`}<p class="error" role="alert" id="targetError"></p><div class="actions"><button data-action="close">取消</button><button class="primary" data-action="importPreview">预览导入</button></div>`}
if(d.step===4){title='确认导入';body=`<p class="hint">${esc(artist(d.artist).name)}${d.source==='album'?' / '+esc(d.collection?collection(d.collection).name:'新的临时作品集'):''} · ${d.source==='album'?'相册样例':d.source+' 解压流程演示'}</p><div class="group">${d.source==='album'?albumSamples.filter(p=>d.chosen.has(p.key)).map(p=>`<div class="resultrow">${p.name}<small>${p.key==='photoFail'?'首次模拟失败，可重试':'可导入'}</small></div>`).join(''):`<div class="resultrow">湖畔散步<small>2 张图片 + 1 个 GIF · 按原名建组</small></div><div class="resultrow">过程记录<small>1 个 MP4 · 保留条目并建组</small></div><div class="resultrow">文字说明<small>1 个 TXT · 无有效媒体，跳过</small></div><div class="resultrow">受损草稿<small>1 张损坏图片 · 失败时不建空组，可重试</small></div>`}</div><div class="notice">只更新当前演示状态，不读取压缩包、不写入磁盘。刷新或重置恢复样例。</div><div class="actions"><button data-action="close">取消</button><button class="primary" data-action="executeImport">开始演示导入</button></div>`}
if(d.step===5){title=d.busy?'正在模拟导入':'导入结果';body=`<p class="hint">${esc(artist(d.artist).name)} · ${d.source==='album'?'相册':d.source} 流程演示</p>${d.busy?'<div class="progress"><span id="importProgress"></span></div><p class="hint" id="importStatus">正在准备示例媒体…</p>':`<div class="notice">新增资产 ${d.results.filter(r=>r.status==='new').length} 项，复用资产 ${d.results.filter(r=>r.status==='reuse').length} 项，跳过 ${d.results.filter(r=>r.status==='skip').length} 项，失败 ${d.results.filter(r=>r.status==='fail').length} 项。<br>新增作品集 ${d.created||0} 个；文件未写入磁盘。</div><div>${d.results.map(r=>`<div class="resultrow ${r.status==='fail'?'danger':''}">${esc(r.path)}<small>${esc(r.note)}</small></div>`).join('')}</div><div class="actions">${d.results.some(r=>r.status==='fail')?'<button class="soft" data-action="retryImport">重试失败项</button>':''}<button class="primary" data-action="finishImport">查看图库</button></div>`}`;back=''}
openModal(title,body,{back});if(d.step===1&&d.source==='album')document.querySelectorAll('[name=albumItem]').forEach(el=>el.onchange=()=>{el.checked?d.chosen.add(el.value):d.chosen.delete(el.value);$('#albumCount').textContent=`已选择 ${d.chosen.size} 张`;$('#albumNext').disabled=!d.chosen.size});if($('#passwordForm'))$('#passwordForm').onsubmit=e=>{e.preventDefault();if($('#archivePassword').value!=='1234'){$('#passwordError').textContent='密码不正确，请重试。没有导入任何媒体。';$('#archivePassword').focus()}else{d.passwordOK=true;showImport()}};if(d.step===3){const fill=()=>{if(d.source!=='album')return;$('#importCollection').innerHTML='<option value="">新建临时作品集</option>'+groups(d.artist).map(c=>`<option value="${c.id}" ${d.collection===c.id?'selected':''}>${esc(c.name)}</option>`).join('')};fill();$('#importArtist').onchange=e=>{d.artist=e.target.value;d.collection='';fill()};if($('#importCollection'))$('#importCollection').onchange=e=>d.collection=e.target.value}}
function archiveItems(){return [{key:'zipA',name:'湖边晨光.png',type:'image',src:sources.p1,folder:'湖畔散步'},{key:'zipB',name:'水面倒影.png',type:'image',src:sources.p2,folder:'湖畔散步'},{key:'gif',name:'微光.gif',type:'gif',src:sources.gif,folder:'湖畔散步'},{key:'zipVideo',name:'绘画过程.mp4',type:'video',size:'6.2 MB',folder:'过程记录'},{key:'txt',name:'说明.txt',type:'text',folder:'文字说明'},{key:'zipFail',name:'草稿.png',type:'image',src:sources.p10,folder:'受损草稿'}]}
function executeImport(retry=false){const d=draft;if(d.busy)return;d.busy=true;d.step=5;showImport();let percent=0;const tick=d.job=setInterval(()=>{percent+=25;if($('#importProgress'))$('#importProgress').style.width=percent+'%';if($('#importStatus'))$('#importStatus').textContent=`正在处理示例媒体 · ${percent}%`;if(percent<100)return;clearInterval(tick);let items=d.source==='album'?albumSamples.filter(p=>d.chosen.has(p.key)):archiveItems();if(retry)items=items.filter(p=>d.results.some(r=>r.key===p.key&&r.status==='fail'));else{d.results=[];d.created=0;d.folderGroups={}}for(const p of items){const path=(p.folder?p.folder+'/':'')+p.name;let status,note;if(p.type==='text'){status='skip';note='无有效媒体，跳过 TXT，不创建空作品集。'}else if(['photoFail','zipFail'].includes(p.key)&&!retry){status='fail';note='模拟读取失败；该项未加入图库，可重试。'}else{let c;if(d.source==='album'){if(!d.collection){const temporaryName=temporaryCollectionName(d.artist);c={id:'c'+state.next++,artist:d.artist,name:temporaryName,ids:[]};state.collections.push(c);d.collection=c.id;d.created++}else c=collection(d.collection)}else{const cid=d.folderGroups[p.folder];c=cid?collection(cid):null;if(!c){c={id:'c'+state.next++,artist:d.artist,name:p.folder,ids:[]};state.collections.push(c);d.folderGroups[p.folder]=c.id;d.created++}}const exists=!!state.media[p.key],already=c.ids.includes(p.key);if(!exists)state.media[p.key]={id:p.key,name:p.name,type:p.type,src:p.src,size:p.size};if(!already)c.ids.push(p.key);status=exists?'reuse':'new';note=`${exists?'复用已有原图':'新增示例资产'}；${already?'已有引用已跳过':'已加入 '+c.name}${p.type==='video'?'，MP4 条目保留，不含实际视频文件':''}。`}const result={key:p.key,path,status,note};const old=d.results.findIndex(r=>r.key===p.key);if(old>=0)d.results[old]=result;else d.results.push(result)}d.busy=false;showImport();render()},170)}
function startExport(scope,ids=null){let cs=[],label='';if(scope==='collection'){cs=[collection(ui.collection)];label=cs[0].name}else if(scope==='artist'){cs=groups(ui.artist);label=artist(ui.artist).name}else if(scope==='backup'){cs=state.collections;label='完整图库备份'}else if(scope==='all'){cs=state.collections;label='全部图库'}else label=`选中的 ${ids.length} 项`;const directoryIds=scope==='images'?ids:cs.flatMap(c=>c.ids),uniqueIds=scope==='backup'?Object.keys(state.media):uniq(directoryIds);exportDraft={scope,label,cs:cs.map(c=>({id:c.id,name:c.name,artist:artist(c.artist).name,ids:[...c.ids]})),ids:uniqueIds,output:scope==='backup'?uniqueIds.length:directoryIds.length,fail:false,busy:false};showExport()}
function showExport(result=null){const d=exportDraft;const content=`<p class="hint">${esc(d.label)} · ${d.scope==='backup'?'完整备份':'导出'}流程演示</p><div class="group"><div class="resultrow">唯一资产 ${d.ids.length} 项<small>${countText(d.ids)}</small></div><div class="resultrow">${d.scope==='backup'?'备份资产':'按目录输出'} ${d.output} 项<small>${d.scope==='backup'?'每份原图只保存一次。':'同一原图在不同作品集目录中可分别输出。'}</small></div></div>${d.scope==='backup'?`<div class="notice">清单包含 ${state.artists.length} 位画师、${state.collections.length} 个作品集、${state.collections.reduce((n,c)=>n+c.ids.length,0)} 个引用，包含封面、名称和手动组内顺序。未归组资产也纳入备份。</div>`:''}<div>${d.cs.length?d.cs.map(c=>`<div class="resultrow">${esc(c.artist)} / ${esc(c.name)}<small>${c.ids.length} 项 · ${c.ids.map(id=>esc(state.media[id].name)).join('、')||'空作品集'}</small></div>`).join(''):d.ids.map(id=>`<div class="resultrow">${esc(state.media[id].name)}</div>`).join('')}</div>`;if(result){openModal(result==='failed'?'模拟导出失败':'演示结果',content+`<div class="${result==='failed'?'error':'notice'}" role="status">${result==='failed'?'模拟空间不足，未生成输出；图库与引用没有改变。可模拟补足空间后重试。':`已完成 ${d.output} 项的输出流程演示。没有生成真实文件或备份包；GIF / MP4 按上述范围保留。`}</div><div class="actions">${result==='failed'?'<button class="primary" data-action="retryExport">模拟补足空间并重试</button>':'<button class="primary" data-action="close">完成</button>'}</div>`);return}openModal(d.scope==='backup'?'完整备份预览':'导出预览',content+`<label class="radiooption" style="margin-top:16px"><input id="exportFail" type="checkbox">模拟空间不足</label><p class="hint">本演示不创建真实文件，也不访问设备存储。</p><div class="actions"><button data-action="close">取消</button><button class="primary" data-action="executeExport" ${d.ids.length?'':'disabled'}>开始演示</button></div>`)}
function executeExport(retry=false){const d=exportDraft;if(d.busy)return;d.fail=retry?false:$('#exportFail').checked;d.busy=true;openModal('正在模拟输出',`<p class="hint">${esc(d.label)}</p><div class="progress"><span id="exportProgress"></span></div><p id="exportStatus" class="hint">正在核对范围…</p>`);let percent=0;const task=d.job=setInterval(()=>{percent+=25;$('#exportProgress').style.width=percent+'%';$('#exportStatus').textContent=`正在模拟${percent<50?'核对原图':percent<100?'生成目录和清单':'完成检查'} · ${percent}%`;if(percent===100){clearInterval(task);d.busy=false;showExport(d.fail?'failed':'done')}},170)}
function exportChoose(){openModal('选择导出范围',`<div class="group">${row('图片','从全部示例图片中选择','chooseImages','image')}${row('作品集','包含图片、GIF 和 MP4 条目','chooseCollections','album')}${row('画师','导出该画师的所有作品集','chooseArtists','artists')}${row('全部图库','按画师和作品集组织目录','exportAll','export')}</div>`)}
function chooseImages(){const ids=images(Object.keys(state.media));openModal('选择导出图片',`<div class="group">${ids.map(id=>`<label class="row"><input type="checkbox" name="exportImage" value="${id}" style="width:20px;height:20px;accent-color:var(--action)"><span class="rowtext"><strong>${esc(state.media[id].name)}</strong></span></label>`).join('')}</div><div class="actions"><button data-action="exportChoose">返回</button><button class="primary" id="exportSelectedImages" disabled>预览导出</button></div>`);document.querySelectorAll('[name=exportImage]').forEach(el=>el.onchange=()=>$('#exportSelectedImages').disabled=!document.querySelector('[name=exportImage]:checked'));$('#exportSelectedImages').onclick=()=>startExport('images',[...document.querySelectorAll('[name=exportImage]:checked')].map(el=>el.value))}
document.addEventListener('input',e=>{if(e.target.id==='artistSearch'){ui.search=e.target.value;renderArtists()}});
document.addEventListener('keydown',e=>{const dialog=$('#dialog');if(!dialog)return;if(e.key==='Escape'){e.preventDefault();closeModal()}if(e.key==='Tab'){const all=[...dialog.querySelectorAll('button:not(:disabled),input:not(:disabled),select:not(:disabled),[tabindex="0"]')].filter(x=>x.offsetParent!==null);if(!all.length){e.preventDefault();dialog.focus();return}const first=all[0],last=all[all.length-1];if(e.shiftKey&&(document.activeElement===first||document.activeElement===dialog)){e.preventDefault();last.focus()}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus()}}});
document.addEventListener('click',e=>{if(e.target.classList.contains('overlay')){closeModal();return}const target=e.target.closest('[data-action]');if(!target||target.disabled)return;const [act,value]=target.dataset.action.split(':');switch(act){case'close':closeModal();break;case'home':go('home');break;case'manage':go('manage');break;case'artist':ui.artist=value;ui.tab='images';go('artist');break;case'collection':ui.collection=value;go('collection');break;case'back':if(ui.page==='card'){ui.page=ui.returnPage;render();window.scrollTo(0,ui.returnScroll)}else if(ui.page==='comic'){go('collection')}else if(ui.page==='collection'){ui.tab='collections';go('artist')}else if(ui.page==='unfiled')go('manage');else go('home');break;case'clearSearch':ui.search='';if($('#artistSearch'))$('#artistSearch').value='';renderArtists();break;case'tab':ui.tab=value;ui.selection=false;ui.selected.clear();render();break;case'newCollection':newCollection();break;case'rename':newCollection(true);break;case'artistMenu':menu('画师操作',[['新建作品集','newCollection','plus'],['导入示例','import','import'],['导出这位画师','exportArtist','export']]);break;case'collectionMenu':menu('作品集操作',[['作品集改名','rename','album'],['导入示例','import','import'],['导出这个作品集','exportCollection','export']]);break;case'cardMenu':menu('图片操作',[['加入其他作品集','reuseCard','plus'],['导出这张图片','exportCard','export']]);break;case'select':ui.selection=!ui.selection;ui.selected.clear();render();break;case'selectAll':images(visibleIds()).forEach(id=>ui.selected.add(id));render();break;case'media':if(ui.selection){ui.selected.has(value)?ui.selected.delete(value):ui.selected.add(value);render()}else if(state.media[value].type==='video'){openModal('MP4 保留条目',`<div class="notice">${esc(state.media[value].name)}<br>${state.media[value].size} · 位于 ${esc(collection(ui.collection).name)}</div><p class="hint">该条目参与作品集、画师导出及完整备份。本原型没有实际 MP4 文件，不提供视频播放。</p><div class="actions"><button data-action="close">返回</button><button class="primary" data-action="exportCollection">导出作品集</button></div>`)}else{ui.cardIds=images(visibleIds());ui.cardIndex=ui.cardIds.indexOf(value);ui.returnPage=ui.page;ui.returnScroll=scrollY;go('card')}break;case'prev':ui.cardIndex=(ui.cardIndex-1+ui.cardIds.length)%ui.cardIds.length;render();break;case'next':ui.cardIndex=(ui.cardIndex+1)%ui.cardIds.length;render();break;case'original':original();break;case'comic':go('comic');break;case'sort':openSort();break;case'sortValue':if(ui.page==='comic')ui.comicSort[ui.collection]=value;else ui.sorts[ui.collection]=value;closeModal();render();if(ui.page==='comic')window.scrollTo(0,0);break;case'reuse':openReuse();break;case'reuseCard':openReuse([ui.cardIds[ui.cardIndex]]);break;case'remove':removeSelected();break;case'unfiled':go('unfiled');break;case'effect':state.effect=!state.effect;render();break;case'gif':state.gifPaused=!state.gifPaused;render();break;case'about':openModal('演示说明','<p class="hint">这是一个仅供选型的 HTML 原型，尚未开发正式安卓应用。</p><div class="group"><div class="resultrow">实际交互<small>搜索、导航、作品集整理、共享引用、排序、卡牌拖动、原图缩放、漫画阅读和 GIF 动画。</small></div><div class="resultrow">流程演示<small>相册与 ZIP / RAR / 7z 导入、密码与分卷、MP4 保留、导出和备份。仅修改内存示例数据，没有真实解压或文件保存。</small></div><div class="resultrow">原创中性素材<small>内嵌 SVG 风景插画和实际三帧 GIF。没有私人包图片、远程资源或上传。</small></div></div><p class="hint">刷新或“重置示例状态”会恢复初始收藏。</p>');break;case'reset':openModal('重置示例状态？','<p class="hint">这次演示中新增的作品集、引用和导入结果将恢复为初始样例。</p><div class="actions"><button data-action="close">取消</button><button class="primary" data-action="confirmReset">重置示例</button></div>');break;case'confirmReset':state=initial();ui={page:'home',artist:'a1',collection:'c1',tab:'images',search:'',selection:false,selected:new Set(),sorts:{},comicSort:{},cardIds:[],cardIndex:0,returnPage:'collection',returnScroll:0};draft=null;exportDraft=null;closeModal();render();window.scrollTo(0,0);toast('已恢复初始示例状态。');break;case'addMenu':startImport(true);break;case'addArtist':addArtist();break;case'addMenuBack':showImport();break;case'import':startImport();break;case'importSource':draft.source=value;draft.step=1;showImport();break;case'scenario':draft.scenario=value;draft.passwordOK=false;draft.completeParts=false;showImport();break;case'importNext':draft.step=draft.source==='album'?3:2;showImport();break;case'importBack':if(draft.step===3)draft.step=draft.source==='album'||draft.scenario==='normal'?1:2;else draft.step--;if(draft.step===2){draft.passwordOK=false;draft.completeParts=false}showImport();break;case'completeParts':draft.completeParts=true;showImport();break;case'importPreview':if(draft.source!=='album'){const names=['湖畔散步','过程记录','受损草稿'],same=groups(draft.artist).filter(c=>names.includes(c.name));if(same.length){$('#targetError').textContent=`已有同名作品集：${same.map(c=>c.name).join('、')}。请选择另一画师，或先为已有作品集改名。不会覆盖或合并。`;break}}draft.step=4;showImport();break;case'executeImport':executeImport();break;case'retryImport':executeImport(true);break;case'finishImport':ui.artist=draft.artist;ui.tab='collections';closeModal();go('artist');break;case'exportChoose':exportChoose();break;case'chooseImages':chooseImages();break;case'chooseCollections':menu('选择作品集',state.collections.map(c=>[artist(c.artist).name+' / '+c.name,'exportGroup:'+c.id,'album']));break;case'chooseArtists':menu('选择画师',state.artists.map(a=>[a.name,'exportPerson:'+a.id,'artists']));break;case'exportGroup':ui.collection=value;startExport('collection');break;case'exportPerson':ui.artist=value;startExport('artist');break;case'exportAll':startExport('all');break;case'exportArtist':startExport('artist');break;case'exportCollection':startExport('collection');break;case'exportImages':startExport('images',[...ui.selected]);break;case'exportCard':startExport('images',[ui.cardIds[ui.cardIndex]]);break;case'backup':startExport('backup');break;case'executeExport':executeExport();break;case'retryExport':executeExport(true);break;}});
